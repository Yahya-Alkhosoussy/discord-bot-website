{% extends "base.html" %}

{% block title %}Add a role to {{ guild.name }} {% endblock %}

{% block header_right %}
    <header>
        <div id="home-head">
            <div id="Portfolio">
                <a class="top" href="{{ url_for('portfolio') }}"> Portfolio </a>
            </div>
            <div id="Bot-Management">
                <a class="top" href="{{ url_for('bot_page') }}"> Bot Management </a>
            </div>
            <div id="Patreon">
                <a class="top" href="https://www.patreon.com/cw/Spidercave">Patreon</a>
            </div>
            <div id="back">
                <a class="top" href="{{ url_for('discord.manage_react_roles', guild_id=guild.id, bot_name=bot_name)}}">Back</a>
            </div>
        </div>
    </header>
{% endblock %}

{% block content %}
    <h1 class="guild-name">{{ guild.name }}</h1>
    <h2>Adding a role to {{ set_name }}:</h2>
    <form method="POST" action="{{ url_for('discord.add_react_role', guild_id=guild.id, set_name=set_name, bot_name=bot_name) }}">
        <label>
            Emoji: (do put "/" before the emoji on discord and put the result here)
            <input type="text" name="emoji" required>
        </label>

        <label>
            Role:
            <select name="role_id" required>
                <option value="">--- pick a role ---</option>
                {% for role in roles %}
                    <option value="{{ role.id }}">{{ role.name }}</option>
                {% endfor %}
            </select>
        </label>

        <button type="submit">Add</button>
    </form>
{% endblock %}
